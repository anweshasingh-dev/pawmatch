{% extends 'base.html' %}
{% from 'ui.html' import icon %}
{% block content %}
<section class="auth-panel panel">
<span class="auth-mark">{{ icon('paw-print') }}</span>
<span class="eyebrow">A community that cares</span>
<h1>Welcome back.</h1>
<p class="muted">Your community, your reports, and a little hope.</p>
<form method="POST">
<div class="field">
<label for="email">Email address</label>
<input type="email" id="email" name="email" autocomplete="email" required>
</div>
<div class="field">
<label for="password">Password</label>
<input type="password" id="password" name="password" autocomplete="current-password" required>
</div>
<button type="submit" class="button primary full-width">Log in {{ icon('arrow-right') }}</button>
</form>
<p class="auth-switch">New around here? <a href="{{ url_for('register') }}">Create an account</a>
</p>
</section>
{% endblock %}
