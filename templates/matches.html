<div class="card">
  <div class="card-img-wrapper">
    <img src="/{{ match.image_path }}" alt="Match Candidate" />
    <span class="match-score-badge">
      ⚡ {{ match.match_score }}% Match
    </span>
  </div>
  
  <div class="card-body">
    <h3 class="card-title">{{ match.pet_name or 'Unnamed Pet' }} ({{ match.species | capitalize }})</h3>
    
    <div class="card-meta">
      📍 {{ match.address }}
    </div>
    <div class="card-meta">
      📅 Date: {{ match.event_date }}
    </div>
    <div class="card-meta">
      🎨 Color: {{ match.color or 'N/A' }} | Breed: {{ match.breed or 'Unknown' }}
    </div>

    <div style="margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--border-color);">
      <a href="tel:{{ match.contact_phone }}" class="btn btn-primary" style="width: 100%; justify-content: center;">
        📞 Contact Owner
      </a>
    </div>
  </div>
</div>
