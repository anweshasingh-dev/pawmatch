{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-800 p-8 rounded-lg border border-gray-700 mt-10">
    <h1 class="text-2xl font-bold mb-6 text-indigo-400">Create Account</h1>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold mb-1">Full Name</label>
            <input type="text" name="name" required class="w-full bg-gray-700 p-2.5 rounded text-sm text-gray-100">
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full bg-gray-700 p-2.5 rounded text-sm text-gray-100">
        </div>
        <div>
            <label class="block text-sm font-semibold mb-1">Password</label>
            <input type="password" name="password" required class="w-full bg-gray-700 p-2.5 rounded text-sm text-gray-100">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 p-2.5 rounded font-bold text-white mt-2">Register</button>
    </form>
</div>
{% endblock %}
