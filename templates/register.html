{% extends 'base.html' %}
{% from 'ui.html' import icon %}
{% block content %}
<section class="auth-panel panel">
<span class="auth-mark">{{ icon('paw-print') }}</span>
<span class="eyebrow">A community that cares</span>
<h1>Make yourself at home.</h1>
<p class="muted">Join the people helping little paws find their way home.</p>
<form method="POST">
<div class="field">
<label for="name">Full name</label>
<input id="name" name="name" autocomplete="name" required>
</div>
<div class="field">
<label for="email">Email address</label>
<input type="email" id="email" name="email" autocomplete="email" required>
</div>
<div class="field">
<label for="password">Password</label>
<input type="password" id="password" name="password" autocomplete="new-password" required>
</div>
<button type="submit" class="button primary full-width">Create account {{ icon('arrow-right') }}</button>
</form>
<p class="auth-switch">Already part of the community? <a href="{{ url_for('login') }}">Log in</a>
</p>
</section>
{% endblock %}
