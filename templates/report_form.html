{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-gray-800 p-8 rounded-lg border border-gray-700">
    <h1 class="text-2xl font-bold mb-6 text-indigo-400">Report {{ report_type }} Pet</h1>

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold mb-1">Pet Photo*</label>
            <input type="file" name="image" required class="w-full bg-gray-700 p-2 rounded text-sm text-gray-200">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Pet Name</label>
                <input type="text" name="pet_name" placeholder="e.g. Bruno" class="w-full bg-gray-700 p-2 rounded text-sm text-gray-100">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Species</label>
                <select name="species" class="w-full bg-gray-700 p-2 rounded text-sm text-gray-100">
                    <option value="dog">Dog</option>
                    <option value="cat">Cat</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Breed / Appearance</label>
                <input type="text" name="breed" placeholder="e.g. Labrador" class="w-full bg-gray-700 p-2 rounded text-sm text-gray-100">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Color / Markings</label>
                <input type="text" name="color" placeholder="e.g. Golden brown" class="w-full bg-gray-700 p-2 rounded text-sm text-gray-100">
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1">Last Seen / Found Address*</label>
            <input type="text" name="address" required placeholder="e.g. Central Park West" class="w-full bg-gray-700 p-2 rounded text-sm text-gray-100">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Your Name*</label>
                <input type="text" name="contact_name" required value="{{ session.get('user', {}).get('name', '') }}" class="w-full bg-gray-700 p-2 rounded text-sm text-gray-100">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Contact Phone*</label>
                <input type="text" name="contact_phone" required placeholder="+1 555-0199" class="w-full bg-gray-700 p-2 rounded text-sm text-gray-100">
            </div>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded font-bold text-white mt-4">
            Submit {{ report_type }} Report
        </button>
    </form>
</div>
{% endblock %}
